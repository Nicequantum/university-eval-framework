# Model-swap configuration for eval harness
# Six-dimension rubric and seed cases remain unchanged regardless of backend

provider: grok  # grok | local
model: grok-4
endpoint: http://localhost:8080/v1  # used when provider=local
temperature: 0.0
max_tokens: 2048

# Held-out rotation uses fixed seed; weekly drift report includes local-vs-grok trend
